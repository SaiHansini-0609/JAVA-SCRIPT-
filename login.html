<html>
<head>
<title>Welcome to ACE e-Book's Website</title>
<script>
function validateLoginForm() {
var username = document.forms["f1"]["username"].value; 
var password = document.forms["f1"]["password"].value; 
if (username.trim() === "") {
alert("Username cannot be empty"); // Shows an alert if empty
return false; // Prevents form submission
}
if (password.length < 6) {
alert("Password must be at least 6 characters long"); 
return false; 
}
return true; 
}
</script>
</head>
<body bgcolor="lightblue">
<center>
<br />
<h3>Login Details</h3>
<br />
<form name="f1" onsubmit="return validateLoginForm()">
<table align="center">
<tr>
<td>Username :</td>
<td><input type="text" name="username" /></td>
</tr>
<tr>
<td><br /></td>
</tr>
<tr>
<td>Password :</td>
<td><input type="password" name="password" /></td>
</tr>
<tr>
<td><br /></td>
</tr>
<tr>
<td></td>
<td>
<input type="submit" value="SUBMIT" />
<input type="reset" value="RESET" />
</td>
</tr>
</table>
</form>
</center>
</body>
</html>
